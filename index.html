<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caleb C. Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700&family=Inter:wght@300..600&display=swap" rel="stylesheet">
<style>
:root{--bg:#354024;--head:#CFBB99;--text:#E5D7C4;--line:#E5D7C4;--btn:#889063;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--disp:'Archivo',var(--sans);--ease:cubic-bezier(.2,.7,.2,1);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 1.0625rem/1.65 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:70}
h1,h2,h3{font-weight:300;color:var(--head);margin:0;line-height:1.05;letter-spacing:-.035em}
a{color:inherit}
:focus-visible{outline:2px solid var(--head);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,56px)}
.bg{position:absolute;inset:0;background:linear-gradient(var(--r,160deg),color-mix(in srgb,var(--head) 24%,var(--bg)),color-mix(in srgb,var(--btn) 75%,var(--bg))) center/cover}
.ph{display:grid;place-items:center;font-size:.85rem;color:color-mix(in srgb,var(--text) 55%,transparent)}
img.ph{width:100%;height:100%;object-fit:cover}

/* home: pick a need */
.home{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.on-page .home{display:none}
.home-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px clamp(20px,5vw,56px);transition:opacity .45s}
.home-head img{display:block;height:clamp(26px,3.4vw,36px);width:auto}
.home-head p{margin:0;font-size:.95rem;opacity:.85}
.panels{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.panel{position:relative;flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 clamp(20px,5vw,56px);overflow:hidden;text-decoration:none;border-top:1px solid color-mix(in srgb,var(--line) 25%,transparent);transition:flex-grow .7s var(--ease),opacity .45s}
.panel:hover,.panel:focus-visible{flex-grow:2.6}
.panel .bg{filter:brightness(.5) saturate(.85);transition:filter .7s,transform 1.4s var(--ease)}
.panel:hover .bg,.panel:focus-visible .bg{filter:none;transform:scale(1.04)}
.panel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 65%,transparent),transparent 70%)}
.panel h2,.panel small{position:relative;z-index:2}
.panel h2{font:700 clamp(1.7rem,6.2vw,5rem)/1 var(--disp);font-stretch:125%;letter-spacing:-.03em}
.panel small{max-width:24ch;text-align:right;font-size:.95rem;line-height:1.4;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .6s var(--ease)}
.panel:hover small,.panel:focus-visible small{opacity:1;transform:none}
.panel.skip{flex-grow:.5}
.panel.skip:hover,.panel.skip:focus-visible{flex-grow:1}
.panel.skip h2{font:500 clamp(.95rem,2.2vw,1.25rem)/1.2 var(--sans);letter-spacing:0}
@keyframes rise{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
.home.in .panel{animation:rise 1s var(--ease) both;animation-delay:var(--d)}
.morphing .home-head{opacity:0}
.morphing .panel:not(.sel){opacity:0}
.morph{position:fixed;inset:0;z-index:60;overflow:hidden;pointer-events:none;transition:clip-path .9s var(--ease),opacity .6s}

/* service page: same structure as the original one-pager */
#page{display:none}
.show-page #page{display:block}
.nav{position:fixed;top:0;left:0;right:0;z-index:40;padding:calc(env(safe-area-inset-top,0px) + 16px) clamp(20px,5vw,56px) 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid transparent;transition:background .4s,border-color .4s}
.nav.solid{background:var(--bg);border-color:color-mix(in srgb,var(--line) 25%,transparent)}
.brand{display:block;line-height:0}
.brand img{display:block;height:clamp(26px,3.4vw,36px);width:auto}
.nav nav{display:flex;gap:clamp(16px,3vw,32px);font-size:.95rem}
.nav nav a{text-decoration:none;opacity:.85;transition:opacity .2s}
.nav nav a:hover{opacity:1}
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden}
.hero .bg{will-change:transform}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 6%,color-mix(in srgb,var(--bg) 60%,transparent) 40%,transparent 78%),color-mix(in srgb,var(--bg) 16%,transparent);pointer-events:none}
.hero-in{position:relative;z-index:2;width:100%;padding-bottom:clamp(40px,9vh,96px);will-change:transform,opacity}
.hero h1{font:700 clamp(2.4rem,8.4vw,7rem)/1.05 var(--disp);font-stretch:125%;letter-spacing:-.03em}
.hero h1 .l{display:block;overflow:hidden;padding-bottom:.08em}
.hero h1 .l span{display:block;transform:translateY(110%)}
.hero p{max-width:34ch;margin:1.4rem 0 2rem;opacity:0}
.hero .btns{opacity:0}
.go .hero h1 .l span{animation:up 1.2s var(--ease) forwards;animation-delay:calc(.1s + var(--i)*.14s)}
.go .hero p{animation:fade 1s ease .7s forwards}
.go .hero .btns{animation:fade 1s ease .9s forwards}
@keyframes up{to{transform:none}}
@keyframes fade{to{opacity:1}}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 26px;background:var(--btn);color:var(--text);border:1px solid color-mix(in srgb,var(--line) 45%,transparent);border-radius:999px;text-decoration:none;font-weight:500;font-size:1rem;transition:border-color .25s,transform .25s var(--ease)}
.btn:hover{border-color:var(--line);transform:translateY(-2px)}
.statement{padding:clamp(96px,22vh,220px) 0}
.fill{font:300 clamp(1.7rem,4.2vw,3.4rem)/1.25 var(--sans);letter-spacing:-.025em;color:var(--head);max-width:22em;margin:0}
.fill span{opacity:.2;transition:opacity .35s}
.fill span.on{opacity:1}
.work{padding-bottom:clamp(72px,14vh,140px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;border-top:1px solid var(--line);padding-top:28px;margin-bottom:clamp(28px,5vw,48px)}
.sec-head h2{font-size:clamp(2rem,5vw,3.6rem)}
.sec-head p{margin:0;max-width:30ch;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:clamp(190px,27vw,400px);gap:clamp(10px,1.6vw,20px)}
.tile{position:relative;margin:0;overflow:hidden;border-radius:6px;grid-column:span 2;opacity:0;transform:translateY(32px);transition:opacity .9s var(--ease) var(--d,0s),transform .9s var(--ease) var(--d,0s)}
.tile.in{opacity:1;transform:none}
.tile:nth-child(1){grid-column:span 4}
.tile:nth-child(6),.tile:nth-child(7){grid-column:span 3}
.tile .bg{transition:transform 1s var(--ease)}
.tile:hover .bg{transform:scale(1.045)}
.tile figcaption{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 14px;background:linear-gradient(to top,color-mix(in srgb,var(--bg) 85%,transparent),transparent);font-size:.95rem;transform:translateY(100%);transition:transform .5s var(--ease)}
.tile:hover figcaption,.tile:focus-within figcaption{transform:none}
.contact{padding:clamp(72px,16vh,160px) 0 48px;border-top:1px solid var(--line)}
.contact h2{font-size:clamp(2.4rem,7vw,5.5rem);max-width:12em}
.contact p{max-width:40ch;margin:1.4rem 0 2rem}
footer{padding:32px 0;font-size:.9rem;opacity:.75}
@media (max-width:760px){
  .nav nav a[data-to=work]{display:none}
  .sec-head{flex-direction:column;align-items:start}
  .panel small{display:none}
  .grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:62vw}
  .tile,.tile:nth-child(n){grid-column:span 1}
  .tile:nth-child(1),.tile:nth-child(7){grid-column:span 2}
  .tile figcaption{transform:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .hero h1 .l span,.hero p,.hero .btns{animation:none!important;transform:none;opacity:1}
  .fill span{opacity:1}
  .tile{opacity:1!important;transform:none!important;transition:none}
  .home.in .panel{animation:none}
  .panel,.panel .bg{transition:none}
}
</style>
</head>
<body>
<div id="home" class="home" role="navigation" aria-label="What do you need?"></div>
<main id="page"></main>

    tagline / statement   page copy
    work      up to 7 images: 'photo.jpg' or {src:'photo.jpg', cap:'Shoot name'}

<script>
(function(){
const $=(s,r)=>(r||document).querySelector(s),B=document.body,home=$('#home'),page=$('#page'),
rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=null,tm,queued=false,nav,hi,hbg,fill,words=[];

function bg(s,i){const d=document.createElement('div');d.className='bg';d.style.setProperty('--r',130+i*23+'deg');if(s.bg)d.style.backgroundImage='url("'+s.bg+'")';return d}

/* home */
home.innerHTML=`<div class="home-head"><img src="${SITE.logo}" alt="${SITE.name}"><p>${SITE.prompt}</p></div><div class="panels"></div>`;
SERVICES.forEach((s,i)=>{
  const a=document.createElement('a');
  a.className='panel'+(s.skip?' skip':'');a.href='#/'+s.id;a.style.setProperty('--d',i*.08+'s');
  a.append(bg(s,i));a.insertAdjacentHTML('beforeend',`<h2>${s.name}</h2><small>${s.sub||''}</small>`);
  a.addEventListener('click',()=>{last=a});
  $('.panels',home).append(a);
});

/* service page */
function render(s,i){
  const w=s.work||[],lines=(s.title||s.name).split('|'),r=[150,200,120,230,170,135,215],
  tiles=r.map((d,n)=>{const t=typeof w[n]==='string'?{src:w[n]}:w[n]||{};
    return `<figure class="tile">${t.src?`<img class="bg ph" src="${t.src}" alt="${t.cap||s.name+' photo '+(n+1)}">`:`<div class="bg ph" style="--r:${d}deg">Image ${n+1}</div>`}<figcaption>${t.cap||'Caption or shoot name'}</figcaption></figure>`}).join('');
  page.innerHTML=`<header class="nav" id="nav"><a class="brand" href="#/" aria-label="Back to all services"><img src="${SITE.logo}" alt="${SITE.name}"></a><nav aria-label="Main"><a href="#/">All services</a><a href="#/${s.id}" data-to="work">Portfolio</a><a href="#/${s.id}" data-to="contact">Contact</a></nav></header>
<section class="hero"><div class="wrap"><div class="hero-in" id="heroIn"><h1 aria-label="${lines.join(' ')}">${lines.map((l,n)=>`<span class="l"><span style="--i:${n}">${l}</span></span>`).join('')}</h1><p>${s.tagline}</p><div class="btns"><a class="btn" href="#/${s.id}" data-to="work">See the portfolio</a><a class="btn" href="#/${s.id}" data-to="contact">Get in touch</a></div></div></div></section>
<section class="statement"><div class="wrap"><p class="fill">${s.statement}</p></div></section>
<section class="work" id="work"><div class="wrap"><div class="sec-head"><h2>Selected work</h2><p>A small sample. More is available on request.</p></div><div class="grid">${tiles}</div></div></section>
<section class="contact" id="contact"><div class="wrap"><h2>Check it out.</h2><p>Email is quickest. Tell me what you’re looking for and I’ll get back to you with ideas, a quote and a plan.</p><div class="btns"><a class="btn" href="mailto:${SITE.email}?subject=${encodeURIComponent(s.name+' enquiry')}">Email</a><a class="btn" href="${SITE.instagram}">Instagram</a></div></div></section>
<footer><div class="wrap">© ${SITE.name} ${new Date().getFullYear()}</div></footer>`;
  $('.hero',page).prepend(bg(s,i));
  nav=$('#nav');hi=$('#heroIn');hbg=$('.hero .bg',page);fill=$('.fill',page);
  fill.innerHTML=fill.textContent.trim().split(/\s+/).map(x=>`<span>${x}</span>`).join(' ');words=[...fill.children];
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
  page.querySelectorAll('.tile').forEach((t,n)=>{t.style.setProperty('--d',(n%3)*.09+'s');io.observe(t)});
  document.title=s.name+' – '+SITE.name;
}
page.addEventListener('click',e=>{
  const t=e.target.closest('[data-to]');if(!t)return;
  e.preventDefault();document.getElementById(t.dataset.to).scrollIntoView({behavior:rm?'auto':'smooth'});
});

/* routing + the home → page transition */
function open(i){
  const s=SERVICES[i],wasPage=B.classList.contains('on-page');
  render(s,i);scrollTo({top:0,behavior:'instant'});B.classList.add('show-page');
  if(!last||wasPage||rm){B.classList.remove('morphing');B.classList.add('on-page','go');last=null;frame();return}
  const r=last.getBoundingClientRect(),m=document.createElement('div');
  m.className='morph';m.append(last.querySelector('.bg').cloneNode());
  m.style.clipPath=`inset(${r.top}px ${innerWidth-r.right}px ${innerHeight-r.bottom}px ${r.left}px)`;
  last.classList.add('sel');B.append(m);B.classList.add('morphing');void m.offsetWidth;
  requestAnimationFrame(()=>{m.style.clipPath='inset(0px)'});
  tm=setTimeout(()=>{
    B.classList.replace('morphing','on-page');B.classList.add('go');m.style.opacity=0;
    setTimeout(()=>m.remove(),700);last=null;frame();
  },900);
}
function close(){
  B.classList.remove('on-page','show-page','go','morphing');last=null;
  document.querySelectorAll('.panel.sel').forEach(p=>p.classList.remove('sel'));
  home.classList.remove('in');void home.offsetWidth;home.classList.add('in');
  scrollTo({top:0,behavior:'instant'});document.title=SITE.name;
}
function route(){
  clearTimeout(tm);document.querySelectorAll('.morph').forEach(m=>m.remove());
  const id=(location.hash.match(/^#\/(\w+)/)||[])[1],i=SERVICES.findIndex(s=>s.id===id);
  i<0?close():open(i);
}

/* scroll effects (as in the original page) */
function frame(){
  queued=false;if(!B.classList.contains('show-page')||!nav)return;
  const y=scrollY,vh=innerHeight;nav.classList.toggle('solid',y>40);
  if(rm)return;
  if(y<vh*1.2){
    hbg.style.transform=`translate3d(0,${y*.25}px,0) scale(${1+y/vh*.08})`;
    hi.style.opacity=Math.max(0,1-y/(vh*.75));
    hi.style.transform=`translate3d(0,${y*.12}px,0)`;
  }
  const b=fill.getBoundingClientRect(),p=Math.min(1,Math.max(0,(vh*.85-b.top)/(b.height+vh*.35))),n=Math.round(p*words.length*1.05);
  words.forEach((w,k)=>w.classList.toggle('on',k<n));
}
const req=()=>{if(!queued){queued=true;requestAnimationFrame(frame)}};
addEventListener('scroll',req,{passive:true});addEventListener('resize',req);
addEventListener('hashchange',route);
route();
})();
</script>
